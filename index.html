<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas 🌻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background-color: #000000;
            font-family: cursive, sans-serif; /* FUENTE 100% OFFLINE */
            cursor: grab; -webkit-user-select: none; user-select: none;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        #main-title {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            width: min(90vw, 700px); font-size: clamp(1.5rem, 2.2vw, 2.8rem);
            line-height: 1.3; color: rgba(255, 250, 205, 0.9);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 18px rgba(255, 165, 0, 0.6);
            z-index: 10; pointer-events: none; text-align: center; white-space: normal;
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: black; display: flex; justify-content: center; align-items: center;
            flex-direction: column; color: white; z-index: 9999; padding: 20px; cursor: pointer;
        }
        #start-button-image {
            width: 150px; height: auto; filter: drop-shadow(0 0 15px #FFD700) drop-shadow(0 0 25px #FFA500);
            transition: all 0.3s ease; margin-bottom: 20px; animation: latido 1.5s infinite ease-in-out; pointer-events: none;
        }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        #start-text { font-size: 1.8em; color: #FFFACD; text-shadow: 0 0 10px #FFD700; text-align: center; pointer-events: none;}
        #love-card-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); cursor: pointer;
        }
        #love-card {
            position: relative; width: 90%; max-width: 400px; aspect-ratio: 9 / 16;
            background-size: cover; background-position: center; border-radius: 20px;
            box-shadow: 0 0 30px #FFD700, 0 0 50px #FFA500; display: flex; justify-content: center; align-items: center; padding: 25px; text-align: center; overflow: hidden;
        }
        #love-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.4); z-index: 1; }
        #love-card-text { position: relative; font-size: 3em; color: #ffffff; text-shadow: 0 0 8px black, 0 0 15px black; z-index: 2; }
        @media (max-width: 768px) {
            #main-title { width: min(88vw, 500px); top: 22px; font-size: clamp(1.3rem, 4vw, 2.2rem); }
            #love-card-text { font-size: 2.8em; }
        }
    </style>
</head>
<body>
    <h1 id="main-title">Feliz dia te amo mucho N.O.T <br>Flores Amarillas  🌻</h1>
    <div id="start-screen">
        <img id="start-button-image" src="assets/asset_01.png" alt="Iniciar">
        <div id="start-text">Toca para iniciar</div>
    </div>
    <div id="love-card-overlay"><div id="love-card"><p id="love-card-text"></p></div></div>
    
    <audio id="background-music" loop><source src="assets/asset_02.mpeg" type="audio/mpeg"></audio>
    <canvas id="galaxy-canvas"></canvas>

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/CopyShader.js"></script>
    <script src="js/LuminosityHighPassShader.js"></script>
    <script src="js/EffectComposer.js"></script>
    <script src="js/RenderPass.js"></script>
    <script src="js/ShaderPass.js"></script>
    <script src="js/UnrealBloomPass.js"></script>
    <script>
    const CONFIG = {
        galaxy: { rotationSpeed: 0.12, centerExclusionRadius: 45 },
        elementExclusionRadius: 40,
        blackHole: { radius: 12, segments: 64, color1: '#000000', color2: '#050505' },
        accretionRing: { innerRadius: 18, outerRadius: 32, segments: 128, centerColor: '#FFFFE0', midColor: '#FFD700', edgeColor: '#FFA500', emissiveIntensity: 0.6 },
        particles: {
            coreStars: { count: 20000, radius: 120, maxHeight: 60, size: 0.25 },
            sphericalHalo: { count: 18000, radiusXZ: 110, radiusY: 55, size: 0.18, minDistFromCenter: 28 },
            backgroundStars: { count: 5000, radius: 500, size: 0.2 },
            texts: {
                count: 50, width: 45, height: 20, minRadius: null, maxRadius: 120,
                content:[ "Feliz día ", "Solo para ti ", "Eres Luz ✨", "Siempre brillas ", "Sonríe siempre ", "Mi flor favorita ", "Luz en mi vida ", "Eres muy especial ✨", "Flores para ti ", "Un detalle amarillo " ],
                colors:[ { fill: '#FFD700', shadow: '#FFA500' }, { fill: '#FFFFE0', shadow: '#DAA520' }, { fill: '#FFFACD', shadow: '#FFD700' } ]
            },
            images: { count: 60, size: 12, minRadius: null, maxRadius: 120, urls:[ 'assets/asset_03.png', 'assets/asset_04.png', 'assets/asset_05.png', 'assets/asset_06.png', 'assets/asset_07.png', 'assets/asset_01.png' ] }
        },
        loveCards: {
            images:[ 'assets/asset_08.png', 'assets/asset_08.png', 'assets/asset_08.png', 'assets/asset_08.png' ], 
            phrases:[ "Eres una persona llena de luz que ilumina la vida de quienes te rodean.⭐", "Hoy quiero celebrar tu vida y desearte que tu mundo siempre esté lleno de colores hermosos.", "Que estas flores amarillas te recuerden lo valiosa que es tu compañía. ✨", "Un pequeño detalle para agradecerte por hacer de mis días algo mucho más especial." ]
        },
        shootingStars: { enabled: true, spawnProbability: 0.01, speed: 1.2 },
        lighting: { ambientLight: { color: '#ffffff', intensity: 0.1 }, pointLight: { color: '#FFD700', intensity: 2.5, distance: 350 } },
        bloomEffect: { threshold: 0.68, strength: 0.7, radius: 0.5 },
        cameraControls: { minDistance: 30, maxDistance: 250 }
    };

    let scene, camera, renderer, controls, galaxyGroup, clock, sphereMaterial, composer;
    let loveTexts = [], loveImages = [], shootingStars = [], occupiedPositions = [];
    let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), currentCardIndex = 0;

    function init() {
        scene = new THREE.Scene(); clock = new THREE.Clock();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('galaxy-canvas'), antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth, window.innerHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.minDistance = CONFIG.cameraControls.minDistance; controls.maxDistance = CONFIG.cameraControls.maxDistance;

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = CONFIG.bloomEffect.threshold; bloomPass.strength = CONFIG.bloomEffect.strength; bloomPass.radius = CONFIG.bloomEffect.radius;
        composer = new THREE.EffectComposer(renderer); composer.addPass(renderScene); composer.addPass(bloomPass);

        const { ambientLight, pointLight } = CONFIG.lighting;
        scene.add(new THREE.AmbientLight(ambientLight.color, ambientLight.intensity));
        const mainLight = new THREE.PointLight(pointLight.color, pointLight.intensity, pointLight.distance);
        mainLight.position.set(0, 0, 0); scene.add(mainLight);
        
        galaxyGroup = new THREE.Group(); scene.add(galaxyGroup);

        createBlackHole(); createCoreStars(); createSphericalHalo(); createBackgroundStars(); createLoveElements();
        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('click', onCanvasClick);
        onWindowResize(); animate();
    }

    function createBlackHole() {
        const bhConfig = CONFIG.blackHole; const ringConfig = CONFIG.accretionRing;
        sphereMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0.0 }, uColor1: { value: new THREE.Color(bhConfig.color1) }, uColor2: { value: new THREE.Color(bhConfig.color2) } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform float uTime; uniform vec3 uColor1; uniform vec3 uColor2; varying vec2 vUv; float noise(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123); } void main() { float n = noise(vUv * 4.0 + uTime * 0.1); vec3 mixedColor = mix(uColor1, uColor2, n); gl_FragColor = vec4(mixedColor, 1.0); }`
        });
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(bhConfig.radius, bhConfig.segments, bhConfig.segments), sphereMaterial));
        const ringGeometry = new THREE.RingGeometry(ringConfig.innerRadius, ringConfig.outerRadius, ringConfig.segments);
        const ringMaterial = new THREE.ShaderMaterial({
            uniforms: { innerRadius: { value: ringConfig.innerRadius }, outerRadius: { value: ringConfig.outerRadius }, centerColor: { value: new THREE.Color(ringConfig.centerColor) }, midColor: { value: new THREE.Color(ringConfig.midColor) }, edgeColor: { value: new THREE.Color(ringConfig.edgeColor) }, emissiveIntensity: { value: ringConfig.emissiveIntensity } },
            vertexShader: `varying vec3 vPosition; void main() { vPosition = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform float innerRadius; uniform float outerRadius; uniform vec3 centerColor; uniform vec3 midColor; uniform vec3 edgeColor; uniform float emissiveIntensity; varying vec3 vPosition; void main() { float distance = length(vPosition.xy); float normalizedDistance = clamp((distance - innerRadius) / (outerRadius - innerRadius), 0.0, 1.0); vec3 finalColor; if (normalizedDistance < 0.5) { finalColor = mix(centerColor, midColor, normalizedDistance * 2.0); } else { finalColor = mix(midColor, edgeColor, (normalizedDistance - 0.5) * 2.0); } float glowFactor = 1.0 - smoothstep(0.0, 1.0, normalizedDistance); vec3 emissiveColor = finalColor * emissiveIntensity * glowFactor; gl_FragColor = vec4(finalColor + emissiveColor, 1.0); }`,
            side: THREE.DoubleSide
        });
        const goldenRing = new THREE.Mesh(ringGeometry, ringMaterial); goldenRing.rotation.x = Math.PI / 2; scene.add(goldenRing);
    }

    function createCoreStars() {
        const coreConfig = CONFIG.particles.coreStars; const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(coreConfig.count * 3); const colors = new Float32Array(coreConfig.count * 3);
        const color = new THREE.Color();
        for (let i = 0; i < coreConfig.count; i++) {
            const distance = CONFIG.accretionRing.outerRadius + Math.random() * (coreConfig.radius - CONFIG.accretionRing.outerRadius);
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * coreConfig.maxHeight * Math.pow(1 - (distance / coreConfig.radius), 1.5);
            positions.set([Math.cos(angle) * distance, y, Math.sin(angle) * distance], i * 3);
            color.setHSL((0.10 + Math.random() * 0.08) % 1, 0.8 + Math.random() * 0.2, 0.6 + Math.random() * 0.4);
            colors.set([color.r, color.g, color.b], i * 3);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        galaxyGroup.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: coreConfig.size, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true })));
    }

    function createSphericalHalo() {
        const haloConfig = CONFIG.particles.sphericalHalo; const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(haloConfig.count * 3); const colors = new Float32Array(haloConfig.count * 3);
        const color = new THREE.Color(); let filled = 0;
        while (filled < haloConfig.count) {
            const rx = (Math.random() * 2 - 1), ry = (Math.random() * 2 - 1), rz = (Math.random() * 2 - 1);
            if (rx * rx + ry * ry + rz * rz > 1.0) continue;
            const x = rx * haloConfig.radiusXZ, y = ry * haloConfig.radiusY, z = rz * haloConfig.radiusXZ;
            const distFromCenter = Math.sqrt(x * x + y * y + z * z);
            if (distFromCenter < haloConfig.minDistFromCenter) continue;
            if (Math.random() > Math.pow(1.0 - (distFromCenter / Math.max(haloConfig.radiusXZ, haloConfig.radiusY)) * 0.7, 1.2)) continue;
            positions.set([x, y, z], filled * 3);
            color.setHSL((0.10 + Math.random() * 0.08) % 1, 0.6 + Math.random() * 0.4, 0.45 + Math.random() * 0.45);
            colors.set([color.r, color.g, color.b], filled * 3); filled++;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        galaxyGroup.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: haloConfig.size, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.65 })));
    }

    function createLoveElements() {
        const textConfig = CONFIG.particles.texts; const imageConfig = CONFIG.particles.images; const textureLoader = new THREE.TextureLoader();
        for (let i = 0; i < textConfig.count; i++) {
            const colorData = textConfig.colors[i % textConfig.colors.length];
            const texture = createTextTexture(textConfig.content[i % textConfig.content.length], colorData);
            const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(textConfig.width, textConfig.height), new THREE.MeshPhongMaterial({ map: texture, transparent: true, alphaTest: 0.1, emissive: colorData.fill, emissiveIntensity: 1.2 }));
            setElementOrbitPosition(textMesh, textConfig.minRadius, textConfig.maxRadius); galaxyGroup.add(textMesh); loveTexts.push(textMesh);
        }
        for (let i = 0; i < imageConfig.count; i++) {
            textureLoader.load(imageConfig.urls[i % imageConfig.urls.length], (texture) => {
                const aspect = texture.image.width / texture.image.height;
                const imageMesh = new THREE.Mesh(new THREE.PlaneGeometry(aspect > 1 ? imageConfig.size : imageConfig.size * aspect, aspect > 1 ? imageConfig.size / aspect : imageConfig.size), new THREE.MeshBasicMaterial({ map: createRoundedImageTexture(texture), transparent: true, alphaTest: 0.1, color: 0xBBBBBB }));
                setElementOrbitPosition(imageMesh, imageConfig.minRadius, imageConfig.maxRadius); galaxyGroup.add(imageMesh); loveImages.push(imageMesh);
            });
        }
    }

    function createBackgroundStars() {
        const bgConfig = CONFIG.particles.backgroundStars; const geometry = new THREE.BufferGeometry(); const positions = new Float32Array(bgConfig.count * 3);
        for (let i = 0; i < bgConfig.count; i++) positions.set([(Math.random() - 0.5) * 2 * bgConfig.radius, (Math.random() - 0.5) * 2 * bgConfig.radius, (Math.random() - 0.5) * 2 * bgConfig.radius], i * 3);
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ size: bgConfig.size, color: 0xffffff, transparent: true, opacity: 0.5 })));
    }

    function createShootingStar() {
        const star = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3)), new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, blending: THREE.AdditiveBlending, transparent: true }));
        star.position.set(THREE.MathUtils.randFloatSpread(800), THREE.MathUtils.randFloat(100, 300), THREE.MathUtils.randFloatSpread(800));
        star.userData.velocity = new THREE.Vector3((Math.random() < 0.5 ? -1 : 1) * CONFIG.shootingStars.speed, -CONFIG.shootingStars.speed * 0.5, (Math.random() - 0.5) * 2);
        star.userData.life = 0; shootingStars.push(star); scene.add(star);
    }

    function setElementOrbitPosition(element, minRadius, maxRadius) {
        const safeMinRadius = minRadius || CONFIG.elementExclusionRadius; const safeMaxRadius = maxRadius || CONFIG.particles.coreStars.radius;
        let validPosition = false, attempts = 0, finalPosition = { x: 0, y: 0, z: 0 };
        while (!validPosition && attempts < 50) {
            attempts++; const radius = safeMinRadius + Math.random() * (safeMaxRadius - safeMinRadius); const theta = Math.random() * Math.PI * 2;
            const x = radius * Math.cos(theta), y = (Math.random() - 0.5) * 15, z = radius * Math.sin(theta);
            validPosition = true;
            for (let pos of occupiedPositions) if (Math.sqrt(Math.pow(x - pos.x, 2) + Math.pow(y - pos.y, 2) + Math.pow(z - pos.z, 2)) < 18) { validPosition = false; break; }
            if (validPosition) finalPosition = { x, y, z };
        }
        element.position.set(finalPosition.x, finalPosition.y, finalPosition.z); occupiedPositions.push(finalPosition);
    }

    function createTextTexture(text, color) {
        const canvas = document.createElement('canvas'); canvas.width = 1536; canvas.height = 512; const context = canvas.getContext('2d');
        context.font = '84px cursive, sans-serif'; context.fillStyle = color.fill; context.textAlign = 'center'; context.textBaseline = 'middle'; context.shadowColor = color.shadow; context.shadowBlur = 3;
        const words = text.split(' '); let lines = [], currentLine = words[0];
        for (let i = 1; i < words.length; i++) {
            if (context.measureText(currentLine + ' ' + words[i]).width > canvas.width - 100 && currentLine.length > 0) { lines.push(currentLine); currentLine = words[i]; }
            else currentLine += ' ' + words[i];
        }
        lines.push(currentLine);
        lines.forEach((line, index) => context.fillText(line, canvas.width / 2, (canvas.height / 2 - (lines.length - 1) * 100 / 2) + index * 100));
        return new THREE.CanvasTexture(canvas);
    }

    function createRoundedImageTexture(texture) {
        const img = texture.image, maxSize = 512;
        const w = (img.width > img.height) ? maxSize : (img.width / img.height) * maxSize, h = (img.width > img.height) ? (img.height / img.width) * maxSize : maxSize;
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; const r = Math.min(w, h) * 0.1;
        ctx.clearRect(0, 0, w, h); ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r); ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h); ctx.lineTo(r, h); ctx.quadraticCurveTo(0, h, 0, h - r); ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.clip(); ctx.drawImage(img, 0, 0, w, h);
        const newTexture = new THREE.CanvasTexture(canvas); newTexture.encoding = THREE.sRGBEncoding; newTexture.generateMipmaps = false; newTexture.minFilter = THREE.LinearFilter; newTexture.magFilter = THREE.LinearFilter; return newTexture;
    }

    function onWindowResize() {
        const width = window.innerWidth, height = window.innerHeight;
        renderer.setSize(width, height); composer.setSize(width, height);
        camera.aspect = width / height; camera.position.set(0, 35, width < 768 ? 150 : 120); camera.updateProjectionMatrix();
    }

    function onCanvasClick(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera); if (raycaster.intersectObjects(loveImages).length > 0) showLoveCard();
    }

    function showLoveCard() {
        document.getElementById('love-card').style.backgroundImage = `url('${CONFIG.loveCards.images[currentCardIndex]}')`;
        document.getElementById('love-card-text').textContent = CONFIG.loveCards.phrases[currentCardIndex];
        document.getElementById('love-card-overlay').style.display = 'flex'; currentCardIndex = (currentCardIndex + 1) % CONFIG.loveCards.images.length;
    }

    function animate() {
        requestAnimationFrame(animate); const elapsedTime = clock.getElapsedTime();
        galaxyGroup.rotation.y = elapsedTime * CONFIG.galaxy.rotationSpeed;
        if (sphereMaterial) sphereMaterial.uniforms.uTime.value = elapsedTime;
        loveTexts.forEach(t => t.lookAt(camera.position)); loveImages.forEach(i => i.lookAt(camera.position));
        if (CONFIG.shootingStars.enabled && Math.random() < CONFIG.shootingStars.spawnProbability) createShootingStar();
        shootingStars.forEach((star, index) => { star.position.add(star.userData.velocity); star.userData.life++; if (star.userData.life > 300) { scene.remove(star); shootingStars.splice(index, 1); } });
        controls.update(); composer.render();
    }

    document.getElementById('start-screen').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('background-music').play().catch(e => console.error("Audio block", e));
        init();
    });
    document.getElementById('love-card-overlay').addEventListener('click', () => { document.getElementById('love-card-overlay').style.display = 'none'; });
    </script>
</body>
</html>
